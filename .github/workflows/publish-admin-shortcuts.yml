name: Publish admin links into bundled dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-admin-shortcuts.yml'
      - 'tools/enable_admin_shortcuts.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout with push access
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update embedded admin navigation
        run: |
          python3 tools/enable_admin_shortcuts.py
          python3 tools/build_dashboard.py
      - name: Verify embedded HTML exactly matches source
        run: python3 tests/test_admin_entrypoints.py -v
      - name: Check mini-program compatibility navigation
        run: |
          node tests/test_tsl8_ui_runtime.js
          python3 tests/test_tsl8_compat_wiring.py -v
      - name: Run existing dashboard functionality checks
        run: node tests/test_dashboard.js
      - name: Commit generated dashboard and bundled header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_source.html index_html.h bluetooth_admin_ui.h
          if git diff --cached --quiet; then
            echo "Dashboard already up to date"
          else
            git commit -m "Expose BLE, firmware OTA, recovery and S3XY gesture controls"
            git push origin HEAD:main
          fi
