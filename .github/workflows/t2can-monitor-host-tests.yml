name: T-2CAN passive monitoring host checks
on:
  push:
  pull_request:
jobs:
  passive-host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged P4CAN source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compile and run pure C++ monitor tests (no CAN hardware)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_t2can_monitor_pure.cpp -o /tmp/t2can_monitor_test
          /tmp/t2can_monitor_test
      - name: Validate read-only API integration
        run: python3 tests/test_t2can_monitor_wiring.py -v
      - name: Validate firmware OTA authentication, recovery and BLE wiring
        run: |
          python3 tests/test_ota_auth_wiring.py -v
          python3 tests/test_recovery_wiring.py -v
          python3 tests/test_ble_admin_wiring.py -v
      - name: Compile and check BLE admin password parser
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_ble_admin_auth_pure.cpp -o /tmp/ble_admin_test
          /tmp/ble_admin_test
      - name: Test independent mini-program companion tools
        run: |
          python3 tests/test_tsl8_compat_wiring.py -v
          node tests/test_tsl8_ui_runtime.js
      - name: DashKit body control pure host tests and routing guards
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_dashkit_body_pure.cpp -o /tmp/dashkit_body_test
          /tmp/dashkit_body_test
          python3 tests/test_dashkit_body_wiring.py -v
      - name: Git whitespace check
        run: git -c core.whitespace=cr-at-eol diff --check HEAD^ HEAD
