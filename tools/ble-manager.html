<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P4CAN 蓝牙管理工具</title><style>body{font:16px/1.65 system-ui;background:#0f172a;color:#f8fafc;margin:auto;max-width:650px;padding:20px}input{width:100%;padding:11px;box-sizing:border-box;margin:8px 0;background:#1e293b;color:white;border:1px solid #64748b}button{background:#2563eb;border:0;color:white;padding:12px;border-radius:8px;margin:5px 2px}pre{white-space:pre-wrap;word-break:break-word}p{color:#94a3b8}</style><h2>P4CAN 蓝牙管理</h2><p>本页面不向互联网发送密码。必须在 HTTPS 或 localhost 上打开；支持 Chrome/Edge Web Bluetooth。</p><label>私有 Wi-Fi 热点密码<input id="key" type="password" autocomplete="off" placeholder="输入设备 Wi-Fi 密码"></label><p><button id="connect">连接蓝牙设备</button><button data-cmd="PING">连通测试</button><button data-cmd="STATUS">查询状态</button><button data-cmd="WIFI_RESTART">重启 Wi-Fi</button><button data-cmd="S3XY_SCAN">扫描 S3XY</button><button data-cmd="RESCUE">进入恢复模式</button></p><pre id="out">尚未连接</pre><script>
const svc='ae9d1100-286e-4e87-86cf-b3e52b77ff21',cmd='ae9d1101-286e-4e87-86cf-b3e52b77ff21',ret='ae9d1102-286e-4e87-86cf-b3e52b77ff21';let wr,rd;const o=document.getElementById('out'),key=document.getElementById('key');function show(x){o.textContent=x}
document.getElementById('connect').onclick=async()=>{if(!navigator.bluetooth){show('浏览器不支持 Web Bluetooth，或不是安全来源');return}try{const dev=await navigator.bluetooth.requestDevice({filters:[{services:[svc]}]});const server=await dev.gatt.connect();const service=await server.getPrimaryService(svc);wr=await service.getCharacteristic(cmd);rd=await service.getCharacteristic(ret);show('已连接：'+dev.name)}catch(e){show('连接失败：'+e)}};
for(const b of document.querySelectorAll('[data-cmd]'))b.onclick=async()=>{if(!wr||!rd){show('请先连接设备');return}if(key.value.length<8){show('请先填写私有 Wi-Fi 密码');return}try{await wr.writeValueWithResponse(new TextEncoder().encode(key.value+'|'+b.dataset.cmd));await new Promise(r=>setTimeout(r,350));const v=await rd.readValue();show(new TextDecoder().decode(v))}catch(e){show('BLE 指令失败：'+e)}};
</script></html>
